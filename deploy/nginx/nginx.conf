upstream aiadmin_app {
    server app:8000;
}

upstream aiadmin_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Кабинет (Next.js)
    location / {
        proxy_pass http://aiadmin_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;  # Next.js dev server
    }

    # API
    location /api/ {
        proxy_pass http://aiadmin_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Webhooks (Telegram/VK) — timeout увеличен для обработки
    location /webhook/ {
        proxy_pass http://aiadmin_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;  # Telegram webhook timeout
        proxy_send_timeout 15s;
    }

    # WebSocket для чат-виджета
    location /ws/ {
        proxy_pass http://aiadmin_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;  # WebSocket live
    }

    # Статический JS виджета
    location /widget.js {
        proxy_pass http://aiadmin_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Healthcheck наружу
    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://aiadmin_app;
        proxy_set_header Host $host;
    }

    # Gzip
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}

[project]
name = "ai-admin-backend"
version = "0.1.0"
description = "SaaS «AI-администратор»: автоответчик на сообщения (Telegram, VK, чат-виджет) — backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "redis==5.2.1",
    "celery[redis]==5.5.2",
    "cryptography==44.0.1",
    "bcrypt==4.2.1",
    "pgvector==0.3.6",
    "httpx==0.28.1",
    "orjson==3.10.12",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.18",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() в аргументах по умолчанию

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

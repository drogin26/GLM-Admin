name: ai-admin

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен (см. .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-aiadmin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiadmin} -d ${POSTGRES_DB:-aiadmin}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Один-шот: применяет миграции до старта app/worker/beat (без гонок на первом старте)
  migrate:
    build: { context: ./backend }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aiadmin}
      REDIS_URL: redis://redis:6379/0
    command: ["/srv/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ./backend }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aiadmin}
      REDIS_URL: redis://redis:6379/0
    command: ["/srv/app/.venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    expose:
      - "8000"

  worker:
    build: { context: ./backend }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aiadmin}
      REDIS_URL: redis://redis:6379/0
    command: ["/srv/app/.venv/bin/celery", "-A", "app.celery_app:celery", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  beat:
    build: { context: ./backend }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiadmin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aiadmin}
      REDIS_URL: redis://redis:6379/0
    command: ["/srv/app/.venv/bin/celery", "-A", "app.celery_app:celery", "beat", "--loglevel=info"]
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - frontend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
